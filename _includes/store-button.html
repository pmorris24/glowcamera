{%- if site.app_store_id and site.app_store_id != "" -%}
<a class="store-badge" href="https://apps.apple.com/app/id{{ site.app_store_id }}">
  <img src="https://tools.applemarketingtools.com/api/badges/download-on-the-mac-app-store/black/en-us" alt="Download Glow Camera on the Mac App Store"{% if include.size == "sm" %} style="height:40px"{% endif %}>
</a>
{%- else -%}
<span class="btn btn-ink btn-soon{% if include.size == "sm" %} btn-sm{% endif %}" role="note">
  Coming soon to the Mac App Store
</span>
{%- endif -%}
